services:
  blocklist-chunker:
    # Published image. Docker Hub equivalent:
    #   docker.io/charlestephen/dns-ip-list-chunker:latest
    image: ghcr.io/charlestephen/dns-ip-list-chunker:latest@sha256:bd7a71d2113497611a7ff7cda568af60ad0ffbcc87a8b57a46f310bb8a548c35
    # To build from source instead, drop `image:` and use:
    #   build:
    #     context: .
    #     dockerfile: Containerfile
    restart: unless-stopped
    environment:
      # Comma-separated source list URLs (txt, json, yaml, toml).
      # Optional category tag: threat:https://… — untagged → default.
      BLOCKLIST_URLS: "threat:https://example.com/threat.txt,dns-blocklisting:https://example.com/dns-blocklist.txt,https://example.com/ip-blocklist.txt"
      # Max entries per output chunk. Many DNS/router UIs cap at 100000.
      CHUNK_SIZE: "100000"
      # How often sources are re-fetched (Go duration; 0 disables).
      REFRESH_INTERVAL: "6h"
      # Listen port inside the container; keep in sync with `ports:` below.
      # PORT: "8080"
      # Public base URL for generated chunk links. Leave unset to derive it
      # from reverse-proxy headers (X-Forwarded-Proto / -Host / -Prefix).
      # BASE_URL: "https://lists.example.com"
      # Gates /manage and the exclusion endpoints. Unset disables them.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Persisted exclusions, on the volume below so they survive restarts.
      EXCLUSIONS_FILE: "/data/exclusions.json"
      # Optional remote exclusion lists (same formats as BLOCKLIST_URLS),
      # re-fetched on each refresh. Example: https://lists.example.com/excluded.txt
      # EXCLUSIONS_URLS: "https://lists.example.com/excluded.txt"
      # When true, output_allowlist entries are also stripped from block feeds.
      # Default false keeps allowlisted domains/IPs in the exported blocklists.
      # ALLOWLIST_ALSO_EXCLUDES: "false"
    volumes:
      - blocklist-data:/data
    ports:
      - "8080:8080"

volumes:
  blocklist-data:
